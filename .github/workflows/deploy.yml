name: Deploy to Alibaba Cloud

'on':
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies on runner
        run: |
          set -Eeuo pipefail
          npm ci

      - name: Build on runner
        run: |
          set -Eeuo pipefail
          npm run build

      - name: Prepare deployment bundle
        run: |
          set -Eeuo pipefail
          rm -rf .deploy-tmp
          mkdir -p .deploy-tmp
          cp package.json package-lock.json next.config.ts next-env.d.ts tsconfig.json .deploy-tmp/
          cp -R app src .deploy-tmp/
          if [ -d public ]; then
            cp -R public .deploy-tmp/public
          fi

      - name: Prepare remote upload directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            set -Eeuo pipefail
            rm -rf /tmp/overseas-opportunity-radar-deploy
            mkdir -p /tmp/overseas-opportunity-radar-deploy

      - name: Upload deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: .deploy-tmp
          target: /tmp/overseas-opportunity-radar-deploy

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          CANDIDATE_TRANSLATION_MODEL: ${{ secrets.CANDIDATE_TRANSLATION_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          RSS_FEEDS: ${{ secrets.RSS_FEEDS }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          envs: OPENAI_API_KEY,OPENAI_BASE_URL,CANDIDATE_TRANSLATION_MODEL,PEXELS_API_KEY,FEISHU_WEBHOOK_URL,WECOM_WEBHOOK_URL,WXPUSHER_APP_TOKEN,WXPUSHER_UID,RSS_FEEDS,NEXT_PUBLIC_SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_STORAGE_BUCKET,CRON_SECRET,NEXT_PUBLIC_APP_URL,ADMIN_SECRET
          script: |
            set -Eeuo pipefail

            APP_DIR=/root/overseas-opportunity-radar
            UPLOAD_DIR=/tmp/overseas-opportunity-radar-deploy/.deploy-tmp
            PROCESS_NAME=overseas-opportunity-radar
            APP_PORT=3001

            if [ ! -d "$UPLOAD_DIR" ]; then
              echo "Upload directory not found: $UPLOAD_DIR" >&2
              exit 1
            fi

            mkdir -p "$APP_DIR"

            if ! command -v rsync >/dev/null 2>&1; then
              echo "rsync is required on the target server" >&2
              exit 1
            fi

            rsync -a --delete --exclude '.env.production' "$UPLOAD_DIR"/ "$APP_DIR"/

            cat > "$APP_DIR/.env.production" <<EOF
            OPENAI_API_KEY=${OPENAI_API_KEY}
            OPENAI_BASE_URL=${OPENAI_BASE_URL}
            CANDIDATE_TRANSLATION_MODEL=${CANDIDATE_TRANSLATION_MODEL}
            PEXELS_API_KEY=${PEXELS_API_KEY}
            FEISHU_WEBHOOK_URL=${FEISHU_WEBHOOK_URL}
            WECOM_WEBHOOK_URL=${WECOM_WEBHOOK_URL}
            WXPUSHER_APP_TOKEN=${WXPUSHER_APP_TOKEN}
            WXPUSHER_UID=${WXPUSHER_UID}
            RSS_FEEDS=${RSS_FEEDS}
            OUTPUT_ROOT=output
            TIMEZONE=Asia/Shanghai
            NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
            SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
            SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET}
            CRON_SECRET=${CRON_SECRET}
            NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
            ADMIN_SECRET=${ADMIN_SECRET}
            EOF

            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            if ! command -v node >/dev/null 2>&1; then
              echo "node is required on the target server" >&2
              exit 1
            fi

            if ! command -v npm >/dev/null 2>&1; then
              echo "npm is required on the target server" >&2
              exit 1
            fi

            node -v
            npm -v

            cd "$APP_DIR"
            npm ci
            npm run build

            if ! command -v pm2 >/dev/null 2>&1; then
              npm install -g pm2
            fi

            export NODE_ENV=production
            pm2 restart "$PROCESS_NAME" --update-env || pm2 start npm --name "$PROCESS_NAME" -- run start -- --port "$APP_PORT"
            pm2 save

            cat > /etc/nginx/conf.d/overseas-opportunity-radar.conf <<'EOF'
            server {
                listen 80;
                listen [::]:80;
                server_name radar.yifan1.com admin-radar.yifan1.com;

                return 301 https://$host$request_uri;
            }

            server {
                listen 443 ssl http2;
                listen [::]:443 ssl http2;
                server_name radar.yifan1.com;

                ssl_certificate /etc/letsencrypt/live/radar.yifan1.com/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/radar.yifan1.com/privkey.pem;

                location = / {
                    return 302 https://radar.yifan1.com/site;
                }

                location ^~ /site {
                    proxy_pass http://127.0.0.1:3001;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_set_header X-Forwarded-Host $host;
                    proxy_set_header X-Forwarded-Port $server_port;
                }

                location = /api/lead-events {
                    proxy_pass http://127.0.0.1:3001;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_set_header X-Forwarded-Host $host;
                    proxy_set_header X-Forwarded-Port $server_port;
                }

                location ^~ /_next {
                    proxy_pass http://127.0.0.1:3001;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_set_header X-Forwarded-Host $host;
                    proxy_set_header X-Forwarded-Port $server_port;
                }

                location / {
                    return 404;
                }
            }

            server {
                listen 443 ssl http2;
                listen [::]:443 ssl http2;
                server_name admin-radar.yifan1.com;

                ssl_certificate /etc/letsencrypt/live/admin-radar.yifan1.com/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/admin-radar.yifan1.com/privkey.pem;

                location / {
                    proxy_pass http://127.0.0.1:3001;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_set_header X-Forwarded-Host $host;
                    proxy_set_header X-Forwarded-Port $server_port;
                    proxy_read_timeout 60s;
                    proxy_connect_timeout 60s;
                }
            }
            EOF

            nginx -t
            nginx -s reload

            curl -fsS --retry 10 --retry-delay 3 --retry-connrefused "http://127.0.0.1:${APP_PORT}" >/dev/null

            PUBLIC_RESPONSE=$(mktemp)
            ADMIN_RESPONSE=$(mktemp)
            trap 'rm -f "$PUBLIC_RESPONSE" "$ADMIN_RESPONSE"' EXIT

            curl -kfsS --resolve radar.yifan1.com:443:127.0.0.1 --retry 10 --retry-delay 3 --retry-connrefused https://radar.yifan1.com/site > "$PUBLIC_RESPONSE"
            python - <<'PY' "$PUBLIC_RESPONSE"
from pathlib import Path
import sys
text = Path(sys.argv[1]).read_text(encoding='utf-8', errors='ignore')
if '今日精选机会' not in text:
    print('public site verification failed')
    print(text[:500])
    raise SystemExit(1)
PY

            curl -kfsS --resolve admin-radar.yifan1.com:443:127.0.0.1 --retry 10 --retry-delay 3 --retry-connrefused https://admin-radar.yifan1.com/settings > "$ADMIN_RESPONSE"
            python - <<'PY' "$ADMIN_RESPONSE"
from pathlib import Path
import sys
text = Path(sys.argv[1]).read_text(encoding='utf-8', errors='ignore')
if '运行与推送配置' not in text:
    print('admin site verification failed')
    print(text[:500])
    raise SystemExit(1)
PY

      - name: Verify public site from runner
        run: |
          set -Eeuo pipefail
          curl -kfsS --retry 10 --retry-delay 5 --retry-connrefused https://radar.yifan1.com/site | grep -q '今日精选机会'

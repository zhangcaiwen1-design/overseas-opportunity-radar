name: Deploy to Alibaba Cloud

'on':
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies on runner
        run: |
          set -Eeuo pipefail
          npm ci

      - name: Build on runner
        run: |
          set -Eeuo pipefail
          npm run build

      - name: Prepare deployment bundle
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          CANDIDATE_TRANSLATION_MODEL: ${{ secrets.CANDIDATE_TRANSLATION_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          RSS_FEEDS: ${{ secrets.RSS_FEEDS }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          set -Eeuo pipefail
          rm -rf .deploy-tmp
          mkdir -p .deploy-tmp
          cp package.json package-lock.json .deploy-tmp/
          cp -R scripts .deploy-tmp/
          cp -R .next/standalone/. .deploy-tmp/
          mkdir -p .deploy-tmp/.next
          cp -R .next/static .deploy-tmp/.next/static
          if [ -d public ]; then
            cp -R public .deploy-tmp/public
          fi
          python - <<'PY'
          from pathlib import Path
          import os
          env_lines = [
              f"OPENAI_API_KEY={os.environ['OPENAI_API_KEY']}",
              f"OPENAI_BASE_URL={os.environ['OPENAI_BASE_URL']}",
              f"CANDIDATE_TRANSLATION_MODEL={os.environ['CANDIDATE_TRANSLATION_MODEL']}",
              f"PEXELS_API_KEY={os.environ['PEXELS_API_KEY']}",
              f"FEISHU_WEBHOOK_URL={os.environ['FEISHU_WEBHOOK_URL']}",
              f"WECOM_WEBHOOK_URL={os.environ['WECOM_WEBHOOK_URL']}",
              f"WXPUSHER_APP_TOKEN={os.environ['WXPUSHER_APP_TOKEN']}",
              f"WXPUSHER_UID={os.environ['WXPUSHER_UID']}",
              f"RSS_FEEDS={os.environ['RSS_FEEDS']}",
              'OUTPUT_ROOT=output',
              'TIMEZONE=Asia/Shanghai',
              f"NEXT_PUBLIC_SUPABASE_URL={os.environ['NEXT_PUBLIC_SUPABASE_URL']}",
              f"SUPABASE_SERVICE_ROLE_KEY={os.environ['SUPABASE_SERVICE_ROLE_KEY']}",
              f"SUPABASE_STORAGE_BUCKET={os.environ['SUPABASE_STORAGE_BUCKET']}",
              f"CRON_SECRET={os.environ['CRON_SECRET']}",
              f"NEXT_PUBLIC_APP_URL={os.environ['NEXT_PUBLIC_APP_URL']}",
              f"ADMIN_SECRET={os.environ['ADMIN_SECRET']}",
          ]
          Path('.deploy-tmp/.env.production').write_text('\n'.join(env_lines) + '\n', encoding='utf-8')
          PY

      - name: Install SSH client tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass openssh-client netcat-openbsd

      - name: Deploy over raw SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -Eeuo pipefail

          retry() {
            local attempt=1
            local max_attempts=5
            while true; do
              if "$@"; then
                return 0
              fi
              local exit_code=$?
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "command failed after ${max_attempts} attempts with exit ${exit_code}: $*" >&2
                return "$exit_code"
              fi
              echo "attempt ${attempt}/${max_attempts} failed with exit ${exit_code}, retrying in 5s: $*" >&2
              attempt=$((attempt + 1))
              sleep 5
            done
          }

          export SSHPASS="$SERVER_PASSWORD"
          COMMON_SSH_OPTS=(
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o PreferredAuthentications=password
            -o PubkeyAuthentication=no
            -o ConnectTimeout=20
            -o ConnectionAttempts=1
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -o LogLevel=ERROR
          )
          SSH_OPTS=(-p "$SERVER_PORT" "${COMMON_SSH_OPTS[@]}")
          SCP_OPTS=(-P "$SERVER_PORT" "${COMMON_SSH_OPTS[@]}")
          REMOTE_TARGET="${SERVER_USER}@${SERVER_HOST}"

          echo '=== stage: network diagnostics ==='
          echo "target=${SERVER_HOST}:${SERVER_PORT} user=${SERVER_USER}"
          getent ahostsv4 "$SERVER_HOST" || true
          nc -vz -w 5 "$SERVER_HOST" "$SERVER_PORT"

          echo '=== stage: ssh banner probe ==='
          timeout 10 ssh -vvv -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o ConnectionAttempts=1 -p "$SERVER_PORT" "$REMOTE_TARGET" exit || true

          echo '=== stage: prepare remote upload directory ==='
          retry sshpass -e ssh "${SSH_OPTS[@]}" "$REMOTE_TARGET" "rm -rf /tmp/overseas-opportunity-radar-deploy && mkdir -p /tmp/overseas-opportunity-radar-deploy"

          echo '=== stage: upload deployment files ==='
          retry sshpass -e scp "${SCP_OPTS[@]}" -r .deploy-tmp "$REMOTE_TARGET:/tmp/overseas-opportunity-radar-deploy/"

          echo '=== stage: deploy on server ==='
          retry sshpass -e ssh "${SSH_OPTS[@]}" "$REMOTE_TARGET" "chmod +x /tmp/overseas-opportunity-radar-deploy/.deploy-tmp/scripts/deploy-remote.sh && /tmp/overseas-opportunity-radar-deploy/.deploy-tmp/scripts/deploy-remote.sh"

      - name: Verify public site from runner
        run: |
          set -Eeuo pipefail
          curl -kfsS --retry 10 --retry-delay 5 --retry-connrefused https://radar.yifan1.com/site | grep -q '海外商业机会内参'

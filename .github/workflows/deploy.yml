name: Deploy to Alibaba Cloud

'on':
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies on runner
        run: |
          set -Eeuo pipefail
          npm ci

      - name: Build on runner
        run: |
          set -Eeuo pipefail
          npm run build

      - name: Prepare deployment bundle
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          CANDIDATE_TRANSLATION_MODEL: ${{ secrets.CANDIDATE_TRANSLATION_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          RSS_FEEDS: ${{ secrets.RSS_FEEDS }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          set -Eeuo pipefail
          rm -rf .deploy-tmp
          mkdir -p .deploy-tmp
          cp package.json package-lock.json .deploy-tmp/
          cp -R scripts .deploy-tmp/
          cp -R .next/standalone/. .deploy-tmp/
          mkdir -p .deploy-tmp/.next
          cp -R .next/static .deploy-tmp/.next/static
          if [ -d public ]; then
            cp -R public .deploy-tmp/public
          fi
          python - <<'PY'
          from pathlib import Path
          import os
          env_lines = [
              f"OPENAI_API_KEY={os.environ['OPENAI_API_KEY']}",
              f"OPENAI_BASE_URL={os.environ['OPENAI_BASE_URL']}",
              f"CANDIDATE_TRANSLATION_MODEL={os.environ['CANDIDATE_TRANSLATION_MODEL']}",
              f"PEXELS_API_KEY={os.environ['PEXELS_API_KEY']}",
              f"FEISHU_WEBHOOK_URL={os.environ['FEISHU_WEBHOOK_URL']}",
              f"WECOM_WEBHOOK_URL={os.environ['WECOM_WEBHOOK_URL']}",
              f"WXPUSHER_APP_TOKEN={os.environ['WXPUSHER_APP_TOKEN']}",
              f"WXPUSHER_UID={os.environ['WXPUSHER_UID']}",
              f"RSS_FEEDS={os.environ['RSS_FEEDS']}",
              'OUTPUT_ROOT=output',
              'TIMEZONE=Asia/Shanghai',
              f"NEXT_PUBLIC_SUPABASE_URL={os.environ['NEXT_PUBLIC_SUPABASE_URL']}",
              f"SUPABASE_SERVICE_ROLE_KEY={os.environ['SUPABASE_SERVICE_ROLE_KEY']}",
              f"SUPABASE_STORAGE_BUCKET={os.environ['SUPABASE_STORAGE_BUCKET']}",
              f"CRON_SECRET={os.environ['CRON_SECRET']}",
              f"NEXT_PUBLIC_APP_URL={os.environ['NEXT_PUBLIC_APP_URL']}",
              f"ADMIN_SECRET={os.environ['ADMIN_SECRET']}",
          ]
          Path('.deploy-tmp/.env.production').write_text('\n'.join(env_lines) + '\n', encoding='utf-8')
          PY

      - name: Prepare remote upload directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            set -Eeuo pipefail
            rm -rf /tmp/overseas-opportunity-radar-deploy
            mkdir -p /tmp/overseas-opportunity-radar-deploy

      - name: Upload deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: .deploy-tmp
          target: /tmp/overseas-opportunity-radar-deploy

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            set -Eeuo pipefail
            chmod +x /tmp/overseas-opportunity-radar-deploy/.deploy-tmp/scripts/deploy-remote.sh
            /tmp/overseas-opportunity-radar-deploy/.deploy-tmp/scripts/deploy-remote.sh

      - name: Verify public site from runner
        run: |
          set -Eeuo pipefail
          curl -kfsS --retry 10 --retry-delay 5 --retry-connrefused https://radar.yifan1.com/site | grep -q 'Public Site'
